<section
  class="rounded-3xl border border-slate-200 bg-white p-5 shadow-sm"
  aria-labelledby="orders-heading"
>
  <div class="flex items-center justify-between gap-4">
    <div>
      <p class="text-sm font-medium text-slate-500">Account</p>

      <h2 id="orders-heading" class="mt-1 text-xl font-bold text-slate-950">Your orders</h2>
    </div>

    <span class="rounded-full bg-slate-100 px-3 py-1 text-xs font-semibold text-slate-600">
      {{ orders().length }}
    </span>
  </div>

  <div class="mt-5 max-h-80 space-y-2 overflow-y-auto pr-1">
    @for (orderSummary of orders(); track orderSummary.id) {
      <button
        type="button"
        [attr.data-order-id]="orderSummary.id"
        (click)="selectOrder(orderSummary.id)"
        class="block w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-left transition hover:border-slate-300 hover:bg-slate-100 focus:outline-none focus:ring-4 focus:ring-slate-900/10"
      >
        <div class="flex items-start justify-between gap-4">
          <div class="min-w-0">
            <p class="truncate font-semibold text-slate-950">
              {{ orderSummary.id }}
            </p>

            <p class="mt-1 text-sm text-slate-600">
              {{ orderSummary.itemCount }}
              {{ orderSummary.itemCount === 1 ? 'item' : 'items' }}
            </p>
          </div>

          <span
            class="shrink-0 rounded-full bg-white px-2.5 py-1 text-xs font-semibold text-slate-600"
          >
            {{ orderSummary.status }}
          </span>
        </div>

        <p class="mt-2 text-sm font-semibold text-slate-800">
          {{ orderSummary.total }}
        </p>
      </button>
    } @empty {
      <p class="py-4 text-sm text-slate-500">No previous orders yet.</p>
    }
  </div>
</section>
