@if (step() === 'edit') {
  <div>
    <label for="checkout-email">Email</label>
    <input id="checkout-email" type="email" [formField]="checkoutForm.email" />
  </div>

  <div>
    <label for="delivery-address">Delivery address</label>
    <input id="delivery-address" type="text" [formField]="checkoutForm.deliveryAddress" />
  </div>

  <app-order-editor
    [order]="order()"
    (orderChange)="order.set($event)"
    (placeRequested)="placeCurrentOrder()"
  />

  <button type="button" aria-label="Review order" (click)="reviewOrder()">Review order</button>
} @else {
  <app-order-review />

  <button type="button" aria-label="Edit order" (click)="editOrder()">Edit order</button>
}
