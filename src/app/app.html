<main class="mx-auto max-w-3xl p-8">
  <h1 class="text-3xl font-bold">Order {{ order.id }}</h1>

  <p class="mt-2">
    Status:
    <span class="font-medium">{{ order.status }}</span>
  </p>

  <section class="mt-8">
    @for (line of order.lines; track line.productName) {
      <article class="border-b py-4">
        <h2 class="font-semibold">{{ line.productName }}</h2>
        <p>Quantity: {{ line.quantity }}</p>
        <p>Unit price: {{ line.unitPrice }}</p>
      </article>
    }
  </section>

  <p class="mt-8 text-xl font-semibold">Total: {{ order.total }}</p>
</main>
