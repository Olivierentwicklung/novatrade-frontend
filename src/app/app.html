<main class="mx-auto max-w-3xl p-8">
  <h1 class="text-3xl font-bold">Order {{ order.id }}</h1>

  <p class="mt-2">
    Status:
    <span class="font-medium">{{ order.status }}</span>
  </p>

  <section class="mt-8">
    @for (line of order.lines; track line.productName) {
      <article class="border-b py-4">
        <h2 class="font-semibold">{{ line.productName }}</h2>
        <p>Quantity: {{ line.quantity }}</p>
        <p>Unit price: {{ line.unitPrice }}</p>
        <button
          type="button"
          class="mt-3 rounded border px-4 py-2 font-medium"
          [attr.aria-label]="'Increase ' + line.productName + ' quantity'"
          (click)="increaseQuantity(line.productName)"
        >
          Increase quantity
        </button>
        <button
          type="button"
          class="mt-3 ml-2 rounded border px-4 py-2 font-medium"
          [attr.aria-label]="'Remove ' + line.productName"
          (click)="removeProduct(line.productName)"
        >
          Remove
        </button>
        <button
          type="button"
          class="mt-3 ml-2 rounded border px-4 py-2 font-medium"
          [attr.aria-label]="'Decrease ' + line.productName + ' quantity'"
          (click)="decreaseQuantity(line.productName)"
        >
          Decrease quantity
        </button>
      </article>
    }
  </section>

  <p class="mt-8 text-xl font-semibold">Total: {{ order.total }}</p>
</main>
